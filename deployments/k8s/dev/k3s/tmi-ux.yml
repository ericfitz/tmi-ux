# tmi-ux on the local Raspberry Pi k3s cluster (kube context `k3s-rp`).
#
# Companion to the server's k3s dev overlay in the tmi repo
# (deployments/k8s/dev/k3s/): same namespace, same in-cluster registry
# (rp2:30500), served on NodePort 30081 next to the server's 30080.
# Deploy with `pnpm run deploy:k3s` (scripts/deploy-k3s.sh), which builds
# Dockerfile.chainguard for the host arch (Apple Silicon == Pi arm64), pushes
# to rp2:30500, applies this file, and waits for the rollout.
#
# The app serves the API same-origin under /api (TMI_ENABLE_API_PROXY in
# server.js proxies to the in-cluster tmi-server service, WebSockets included).
# Same-origin avoids both mixed-content blocking under TLS and Chrome's
# local-network-access blocking of cross-host fetches from insecure origins.
#
# Two entry points:
#   - https://tmi.efitz.net — Traefik Ingress (MetalLB VIP 192.168.1.6) with a
#     Let's Encrypt cert from the letsencrypt-route53 ClusterIssuer (DNS-01).
#     Pi-hole resolves tmi.efitz.net via CNAME -> traefik.local (192.168.1.6).
#   - http://rp2:30081 — NodePort, kept for direct access.
# The server's OAuth client_callback_allowlist must admit
# https://tmi.efitz.net/* and http://rp2:30081/* — see deploy-k3s.sh's
# post-deploy note.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tmi-ux
  namespace: tmi-platform
  labels:
    app: tmi-ux
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tmi-ux
  template:
    metadata:
      labels:
        app: tmi-ux
    spec:
      containers:
        - name: tmi-ux
          image: rp2:30500/tmi-ux:dev
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: TMI_ENABLE_API_PROXY
              value: 'true'
            - name: TMI_PROXY_TARGET
              value: http://tmi-server:8080
            - name: TMI_OPERATOR_NAME
              value: TMI dev (k3s-rp)
            - name: TMI_LOG_LEVEL
              value: debug
          readinessProbe:
            httpGet:
              path: /config.json
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /config.json
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: tmi-ux
  namespace: tmi-platform
  labels:
    app: tmi-ux
spec:
  type: NodePort
  selector:
    app: tmi-ux
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30081
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: tmi-ux-tls
  namespace: tmi-platform
spec:
  commonName: tmi.efitz.net
  dnsNames:
    - tmi.efitz.net
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-route53
  secretName: tmi-ux-tls
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tmi-ux
  namespace: tmi-platform
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  rules:
    - host: tmi.efitz.net
      http:
        paths:
          - backend:
              service:
                name: tmi-ux
                port:
                  number: 8080
            path: /
            pathType: Prefix
  tls:
    - hosts:
        - tmi.efitz.net
      secretName: tmi-ux-tls
