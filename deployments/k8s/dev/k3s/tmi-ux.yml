# tmi-ux on the local k3s dev cluster.
#
# Companion to the server's k3s dev overlay in the tmi repo
# (deployments/k8s/dev/k3s/): same namespace, same in-cluster registry,
# served on NodePort 30081 next to the server's 30080.
# Deploy with `pnpm run deploy:k3s` (scripts/deploy-k3s.sh), which builds
# Dockerfile.chainguard for the host arch, pushes to the cluster registry,
# renders the __PLACEHOLDERS__ below from .local/k3s.json (see
# deployments/k8s/dev/k3s/k3s.json.example), applies, and waits for the rollout.
#
# The app serves the API same-origin under /api (TMI_ENABLE_API_PROXY in
# server.js proxies to the in-cluster tmi-server service, WebSockets included).
# Same-origin avoids both mixed-content blocking under TLS and Chrome's
# local-network-access blocking of cross-host fetches from insecure origins.
#
# Two entry points:
#   - https://__UI_HOST__ — Traefik Ingress with a Let's Encrypt cert from the
#     letsencrypt-route53 ClusterIssuer (DNS-01).
#   - http://__NODE_HOST__:30081 — NodePort, kept for direct access.
# The server's OAuth client_callback_allowlist must admit both origins — see
# deploy-k3s.sh's post-deploy note.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tmi-ux
  namespace: tmi-platform
  labels:
    app: tmi-ux
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tmi-ux
  template:
    metadata:
      labels:
        app: tmi-ux
    spec:
      containers:
        - name: tmi-ux
          image: __K3S_REGISTRY__/tmi-ux:__IMAGE_TAG__
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: TMI_ENABLE_API_PROXY
              value: 'true'
            - name: TMI_PROXY_TARGET
              value: http://tmi-server:8080
            - name: TMI_OPERATOR_NAME
              value: TMI dev (k3s)
            - name: TMI_LOG_LEVEL
              value: debug
          readinessProbe:
            httpGet:
              path: /config.json
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /config.json
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: tmi-ux
  namespace: tmi-platform
  labels:
    app: tmi-ux
spec:
  type: NodePort
  selector:
    app: tmi-ux
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30081
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: tmi-ux-tls
  namespace: tmi-platform
spec:
  commonName: __UI_HOST__
  dnsNames:
    - __UI_HOST__
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-route53
  secretName: tmi-ux-tls
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tmi-ux
  namespace: tmi-platform
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  rules:
    - host: __UI_HOST__
      http:
        paths:
          - backend:
              service:
                name: tmi-ux
                port:
                  number: 8080
            path: /
            pathType: Prefix
  tls:
    - hosts:
        - __UI_HOST__
      secretName: tmi-ux-tls
