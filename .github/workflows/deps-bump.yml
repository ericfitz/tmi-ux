name: Dependency Bump (Claude)

on:
  schedule:
    - cron: '0 13 * * *' # daily Dependabot-alert check (bumps only when open alerts exist)
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to bump (a branch name, or "all")'
        default: 'main'
        type: string

permissions:
  contents: read

concurrency:
  group: deps-bump-${{ github.workflow }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  discover:
    if: ${{ github.repository == 'ericfitz/tmi-ux' }}
    runs-on: ubuntu-latest
    outputs:
      branches: ${{ steps.set.outputs.branches }}
    steps:
      - name: Mint GitHub App token (reads Dependabot alerts)
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.DEPS_BOT_APP_ID }}
          private-key: ${{ secrets.DEPS_BOT_APP_PRIVATE_KEY }}
      - id: set
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          SCHED: ${{ github.event.schedule }}
          INPUT_BRANCH: ${{ github.event.inputs.branch }}
        run: |
          set -euo pipefail
          all_branches() {
            gh api "repos/$REPO/branches" --paginate --jq '.[].name' | grep -E '^(main|dev/.*)$' || true
          }
          open_alerts_count() {
            gh api "repos/$REPO/dependabot/alerts?state=open&per_page=1" --jq 'length' 2>/dev/null || echo "ERR"
          }
          if [ "$EVENT" = "workflow_dispatch" ] && [ "$INPUT_BRANCH" != "all" ]; then
            LIST="$INPUT_BRANCH"
          elif [ "$EVENT" = "schedule" ] && [ "$SCHED" = "0 13 * * *" ]; then
            CNT="$(open_alerts_count)"
            if [ "$CNT" = "ERR" ]; then
              echo "::warning::Could not read Dependabot alerts. Ensure the GitHub App has 'Dependabot alerts: read' and the installation re-accepted the updated permission."
              LIST=""
            elif [ "$CNT" -gt 0 ] 2>/dev/null; then
              echo "Open Dependabot alerts present — running the full branch set."
              LIST="$(all_branches)"
            else
              echo "No open Dependabot alerts — nothing to do."
              LIST=""
            fi
          else
            LIST="$(all_branches)"                            # weekly schedule, or dispatch with branch=all
          fi
          BRANCHES="$(printf '%s\n' "$LIST" | jq -R . | jq -cs 'map(select(length > 0))')"
          echo "branches=$BRANCHES" >> "$GITHUB_OUTPUT"
          echo "Discovered branches: $BRANCHES"

  # Two jobs, so the GitHub write token never shares a runner with the agent (#989).
  #
  # bump: the headless agent runs with --dangerously-skip-permissions and
  #   CLAUDE_CODE_OAUTH_TOKEN. It can reach this job's workspace, $GITHUB_ENV,
  #   $GITHUB_PATH, background processes and ACTIONS_RUNTIME_TOKEN (artifact
  #   upload and Actions cache writes, so workflows that hold secrets must not
  #   restore caches). It holds no GitHub write token and no App credentials.
  #   Everything it produces (patches, plan text) is untrusted data.
  # publish: a fresh runner and a fresh checkout. It applies the patches only if
  #   they modify package.json and pnpm-lock.yaml alone and leave the package
  #   manager fields unchanged, squashes them into one commit of its own,
  #   checks the lockfile, and only then mints the App token to push and open
  #   the PR. No agent-written file, hook, env var, PATH entry or process exists
  #   on this runner.
  bump:
    needs: discover
    if: ${{ needs.discover.outputs.branches != '[]' && needs.discover.outputs.branches != '' }}
    runs-on: ubuntu-latest
    # Set by the plugin step, which finishes before the agent starts; a step's
    # outputs can't be changed after it ends. The same for every leg.
    outputs:
      pin_note: ${{ steps.plugin.outputs.pin_note }}
    strategy:
      fail-fast: false
      matrix:
        branch: ${{ fromJson(needs.discover.outputs.branches) }}
    concurrency:
      group: deps-bump-run-${{ matrix.branch }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false # version is read from package.json "packageManager"

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Install Claude Code CLI (pinned)
        env:
          # Pinned so a new CLI release can't run here with the OAuth token
          # before someone reviews it. Move this deliberately, like SKILL_SHA;
          # the check below warns when it falls behind.
          CLAUDE_CODE_VERSION: '2.1.293'
          # Keep the pin: no background self-update.
          DISABLE_UPDATES: '1'
          DISABLE_AUTOUPDATER: '1'
        run: |
          set -euo pipefail
          npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
          latest="$(npm view @anthropic-ai/claude-code version 2>/dev/null || echo unknown)"
          if [ "$latest" != "$CLAUDE_CODE_VERSION" ]; then
            note="Claude Code CLI pin is ${CLAUDE_CODE_VERSION}; npm latest is ${latest}. Review and move CLAUDE_CODE_VERSION in .github/workflows/deps-bump.yml."
            echo "::warning::$note"
            echo "$note" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Vendor the deps plugin into the runner
        id: plugin
        env:
          # Pin ericfitz/skills to a reviewed deps release so the high-privilege
          # agent run below cannot execute an unreviewed change to the skill
          # (ADR 0004). A release is the commit that set the version in
          # deps/.claude-plugin/plugin.json. Move this SHA deliberately when
          # adopting a newer release; the check below warns when it falls behind.
          SKILL_SHA: '4cd8a52ab54091f7167a1ad247784336ebe5c319' # deps v2.0.6
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          git clone --filter=blob:none https://github.com/ericfitz/skills "$tmp/skills"
          manifest=deps/.claude-plugin/plugin.json
          # Versions come from the repo the pin distrusts: accept only plain
          # version strings, and never let the warn-only check fail the job.
          version_of() {
            local v
            v="$(jq -r 'if (.version | type) == "string" and (.version | test("\\A[0-9A-Za-z.+-]{1,40}\\z")) then .version else "unknown" end' 2>/dev/null || true)"
            echo "${v:-unknown}"
          }
          latest="$({ git -C "$tmp/skills" show "origin/HEAD:$manifest" 2>/dev/null || true; } | version_of)"
          git -C "$tmp/skills" checkout -q "$SKILL_SHA"
          pinned="$(version_of < "$tmp/skills/$manifest")"
          for f in skills/bump/SKILL.md scripts/bump.py; do
            if [ ! -f "$tmp/skills/deps/$f" ]; then
              echo "::error::SKILL_SHA $SKILL_SHA has no deps/$f; pin a deps release that has it."
              exit 1
            fi
          done
          echo "deps plugin vendored @ $SKILL_SHA (v$pinned)"
          note=""
          if [ "$pinned" != "$latest" ]; then
            note="Skill pin differs from the latest release: SKILL_SHA is deps v$pinned, ericfitz/skills main has v$latest. Review and move SKILL_SHA in .github/workflows/deps-bump.yml."
            echo "::warning::$note"
            echo "$note" >> "$GITHUB_STEP_SUMMARY"
          fi
          {
            echo "dir=$tmp/skills/deps"
            echo "pin_note=$note"
          } >> "$GITHUB_OUTPUT"

      # Runs before the agent, so the agent can't change these outputs.
      - name: Create working branch
        id: wb
        env:
          BASE: ${{ matrix.branch }}
        run: |
          set -euo pipefail
          git config user.name "deps-bot"
          git config user.email "deps-bot@users.noreply.github.com"
          git checkout -b "deps/auto-bump/${BASE}/${{ github.run_id }}"
          echo "artifact=deps-bump-$(printf '%s' "$BASE" | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Run headless bump (commit only — no push, no PR, no session-completion)
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          PLUGIN_DIR: ${{ steps.plugin.outputs.dir }}
          # Keep the CLI pinned and fetch no unpinned plugin code at startup.
          DISABLE_UPDATES: '1'
          DISABLE_AUTOUPDATER: '1'
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: '1'
          CLAUDE_CODE_DISABLE_OFFICIAL_MARKETPLACE_AUTOINSTALL: '1'
          # Intentionally NO GH_TOKEN: the agent must not perform GitHub writes.
        run: |
          set -euo pipefail
          if [ -z "${CLAUDE_CODE_OAUTH_TOKEN:-}" ]; then
            echo "::error::CLAUDE_CODE_OAUTH_TOKEN is empty (secret missing on this ref)."
            exit 1
          fi
          claude -p "Run the dependency bump skill (deps:bump) on the CURRENT checked-out git branch ONLY. You are running UNATTENDED in CI under a STRICT scope. DO: apply only safe patch/minor dependency updates; run the project build/test/lint; bisect out any update that breaks them; make exactly ONE local commit with the safe updates; then STOP. DO NOT: push; run any session-completion / 'landing the plane' / end-of-session workflow; file or close GitHub issues; run a security review; open a pull request; switch branches; ask questions. A separate CI step handles pushing and the PR. If there are no safe updates, make NO commit and say so. Finally, print the manual-review plan for anything not auto-applied." \
            --plugin-dir "$PLUGIN_DIR" \
            --dangerously-skip-permissions \
            --allowedTools "Bash,Read,Write,Edit,Glob,Grep" | tee "$RUNNER_TEMP/bump-plan.txt"

      # The publish job re-checks everything in this artifact; nothing here is trusted.
      - name: Export the bump as patches
        env:
          BASE: ${{ matrix.branch }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/deps-bump-out"
          mkdir -p "$out/patches"
          git format-patch -o "$out/patches" "origin/${BASE}..HEAD"
          cp "$RUNNER_TEMP/bump-plan.txt" "$out/plan.txt"

      - name: Upload the bump
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.wb.outputs.artifact }}
          path: ${{ runner.temp }}/deps-bump-out
          retention-days: 7
          if-no-files-found: error

  publish:
    needs: [discover, bump]
    # Run for the legs whose bump succeeded even if another leg failed.
    if: ${{ !cancelled() && needs.discover.outputs.branches != '[]' && needs.discover.outputs.branches != '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        branch: ${{ fromJson(needs.discover.outputs.branches) }}
    concurrency:
      group: deps-bump-publish-${{ matrix.branch }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.branch }}
          fetch-depth: 0
          persist-credentials: false

      # Before the patches are applied, so "packageManager" comes from the base branch.
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Name the bump artifact
        id: name
        env:
          BASE: ${{ matrix.branch }}
        run: echo "artifact=deps-bump-$(printf '%s' "$BASE" | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      # A leg whose bump job failed uploaded nothing; that leg publishes nothing.
      - name: Download the bump
        id: download
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: ${{ steps.name.outputs.artifact }}
          path: ${{ runner.temp }}/deps-bump-in

      # The validator comes from this fresh checkout of the base branch, not
      # from the artifact. scripts/deps-bump-apply-patches.sh has the rules.
      - name: Apply and validate the patches
        id: apply
        if: ${{ steps.download.outcome == 'success' }}
        env:
          BASE: ${{ matrix.branch }}
        run: |
          set -euo pipefail
          git config user.name "deps-bot"
          git config user.email "deps-bot@users.noreply.github.com"
          git checkout -b "deps/auto-bump/${BASE}/${{ github.run_id }}"
          # upload-artifact drops an empty patches/ (no safe updates).
          mkdir -p "$RUNNER_TEMP/deps-bump-in/patches"
          bash scripts/deps-bump-apply-patches.sh "origin/${BASE}" "$RUNNER_TEMP/deps-bump-in/patches" >> "$GITHUB_OUTPUT"

      # pnpm's frozen-lockfile check is what CI's install runs; a lockfile that
      # disagrees with package.json or its overrides (#984) fails here instead
      # of opening a PR whose every check fails.
      - name: Verify the lockfile matches package.json
        if: ${{ steps.apply.outputs.changes == 'true' }}
        run: |
          set -euo pipefail
          if ! pnpm install --frozen-lockfile --lockfile-only --ignore-scripts; then
            git --no-pager show --stat HEAD
            echo "::error::pnpm-lock.yaml does not match package.json after the bump; not opening a PR."
            exit 1
          fi
          if ! git diff --quiet HEAD; then
            git status --porcelain
            echo "::error::The lockfile check changed tracked files; not opening a PR."
            exit 1
          fi

      # Minted only after the patches passed validation. Ephemeral (~1h),
      # scoped to this App's Contents + Pull-requests permissions on this repo.
      - name: Mint GitHub App token
        id: app-token
        if: ${{ steps.apply.outputs.changes == 'true' }}
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.DEPS_BOT_APP_ID }}
          private-key: ${{ secrets.DEPS_BOT_APP_PRIVATE_KEY }}

      - name: Open PR
        if: ${{ steps.apply.outputs.changes == 'true' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BASE: ${{ matrix.branch }}
          REPO: ${{ github.repository }}
          PIN_NOTE: ${{ needs.bump.outputs.pin_note }}
        run: |
          set -euo pipefail
          in="$RUNNER_TEMP/deps-bump-in"
          WB="$(git branch --show-current)"
          # persist-credentials was false, so push with the App token explicitly.
          git push "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" "HEAD:refs/heads/${WB}"
          # plan.txt is agent output: strip CRs and fence it with more backticks
          # than its longest run, so it can't close the fence and inject markdown.
          plan="$(tail -c 60000 "$in/plan.txt" 2>/dev/null | tr -d '\r' || true)"
          longest="$(printf '%s' "$plan" | { grep -oE '`+' || true; } | awk '{ if (length > m) m = length } END { print m + 0 }')"
          fence='```'
          while [ "${#fence}" -le "$longest" ]; do fence="${fence}\`"; done
          {
            echo "Automated dependency bump for \`${BASE}\` (safe patch/minor only)."
            echo
            echo "Generated by the \`deps:bump\` skill running headless in CI. Review before merging."
            echo
            if [ -n "$PIN_NOTE" ]; then
              echo "> [!WARNING]"
              echo "> $PIN_NOTE"
              echo
            fi
            echo '<details><summary>Skill output / manual-review plan</summary>'
            echo
            echo "$fence"
            printf '%s\n' "$plan"
            echo "$fence"
            echo '</details>'
          } > "$RUNNER_TEMP/pr-body.md"
          gh pr create --repo "${REPO}" --base "${BASE}" --head "${WB}" \
            --title "chore(deps): automated bump for ${BASE}" \
            --body-file "$RUNNER_TEMP/pr-body.md" \
            --label dependencies
