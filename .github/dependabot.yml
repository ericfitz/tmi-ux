# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # Keep GitHub Actions majors current. Some actions (e.g. astral-sh/setup-uv)
  # stop publishing floating major tags, so a pinned `@vN` silently rots.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      time: "13:00" # 9am EDT
      day: "monday"
    target-branch: "main"

  - package-ecosystem: "npm" # pnpm uses npm ecosystem in Dependabot
    directory: "/"
    schedule:
      interval: "weekly"
      time: "13:00" # 9am EDT
      day: "monday" # every Monday morning
    target-branch: "main" # Adjust if your default branch is different

    # One PR per week for all patch/minor updates. Required for hands-off
    # merging (dependabot-auto-merge.yml): once the version-bump commit lands
    # on a Dependabot branch, Dependabot stops rebasing it, so per-package PRs
    # would deadlock on pnpm-lock.yaml conflicts. Majors stay one PR each.
    groups:
      npm-patch-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]

    ignore:
      # @antv/x6 is exact-pinned with a pnpm patch (patches/@antv__x6@3.1.7.patch,
      # antvis/X6#5048, issue #446). Any bump invalidates the patch and breaks
      # `pnpm install`. Bump by hand after re-verifying the patch.
      - dependency-name: "@antv/x6"

      # Zone.js
      - dependency-name: "zone.js"
        update-types: ["version-update:semver-minor"]
        versions: [">=0.16.0", "<1.0.0"]

      # oxc runtime helpers: must be bumped together with vite/rolldown, never
      # on their own. The helpers pair with the oxc transformer bundled inside
      # rolldown, but neither vite nor rolldown declares this package, so there
      # is no dependency edge for pnpm to enforce -- and build/test/lint stay
      # green even when the pairing is wrong. See the rationale recorded in
      # package.json under comments.devDependencies. Bump it by hand alongside
      # vite, then smoke-test a cold-boot `ng serve` plus a real browser load.
      - dependency-name: "@oxc-project/runtime"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]
